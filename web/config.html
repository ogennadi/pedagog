<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2b2b">
<meta name="robots" content="noindex">
<title>Pedagog — settings</title>
<link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
<link rel="stylesheet" href="vendor/chessground/chessground.base.css">
<link rel="stylesheet" href="vendor/chessground/chessground.brown.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="config.css">
<script type="importmap">
{ "imports": { "chessground": "./vendor/chessground/chessground.min.js" } }
</script>
</head>
<body>
<header>
  <img class="logo" src="icon-192.png" alt="" width="24" height="24">
  <h1>Pedagog</h1>
  <span class="status">settings</span>
</header>

<main class="config">
  <form class="setup" onsubmit="return false">
    <div class="row">
      <label>Appearance
        <select id="theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="system">Same as the system</option>
        </select>
      </label>
      <label>Board colours
        <select id="board-theme"></select>
      </label>
      <label>Piece set
        <output id="current-pieces">—</output>
      </label>
    </div>
    <div class="row buttons">
      <a class="button primary" href="./">Back to the game</a>
      <button type="button" id="reset">Reset to default</button>
    </div>
    <p class="about">Click a board to use its piece set. Choices are saved in this browser.
      The piece sets are Lichess's, each with its own licence (see
      <a href="vendor/lichess-pieces/LICENSES.md">the list</a>); those marked
      <span class="nc">non-commercial</span> may not be used commercially.</p>
  </form>
  <div id="sets" class="sets"></div>
</main>

<script type="module" src="config.js"></script>
</body>
</html>
